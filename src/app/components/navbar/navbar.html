<nav class="navbar" [class.scrolled]="isScrolled">
  <!-- Logo -->
  <span class="logo" (click)="scrollTo('hero')">
    <span class="logo-bracket">&lt;</span>RJ
    <span class="logo-bracket">/&gt;</span>
  </span>

  <!-- Desktop nav links -->
  <ul class="nav-links">
    <li *ngFor="let link of navLinks">
      <button
        class="nav-btn"
        [class.active]="activeSection === link.anchor"
        (click)="scrollTo(link.anchor)"
      >
        {{ link.label }}
        <span class="underline-glow"></span>
      </button>
    </li>
  </ul>

  <!-- Mobile hamburger -->
  <button class="hamburger" (click)="toggleMobile()" [class.open]="mobileOpen" aria-label="Menu">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- Mobile dropdown -->
  <div class="mobile-menu" [class.open]="mobileOpen">
    <button
      *ngFor="let link of navLinks"
      class="mobile-link"
      [class.active]="activeSection === link.anchor"
      (click)="scrollTo(link.anchor)"
    >
      {{ link.label }}
    </button>
  </div>
</nav>
